name: Synthetic voice tests

# Once a week, Claude-played callers phone the production voice agent (no
# real phone call) and the run reports how long each caller waited per turn.
# See worker/svt/run.sh. Runs on macOS for the `say` voices.
on:
  schedule:
    - cron: '0 14 * * 1'   # Mondays, 14:00 UTC
  workflow_dispatch:
    inputs:
      personas:
        description: 'Persona numbers, space-separated (blank = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: svt
  cancel-in-progress: false

jobs:
  svt:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check configuration
        id: cfg
        env:
          ADMIN_KEY: ${{ secrets.SYNTHETIC_ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$DEEPGRAM_API_KEY" ]; then
            echo "::warning::Synthetic voice tests skipped: set repo secrets SYNTHETIC_ADMIN_KEY, ANTHROPIC_API_KEY, DEEPGRAM_API_KEY (worker/scripts/sync-secrets.sh)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: steps.cfg.outputs.ready == 'true'
        run: |
          brew install ffmpeg
          npm ci
      - name: Run calls
        if: steps.cfg.outputs.ready == 'true'
        run: ./svt/run.sh $PERSONAS
        env:
          PERSONAS: ${{ inputs.personas }}
          ADMIN_KEY: ${{ secrets.SYNTHETIC_ADMIN_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL || 'https://mogi-platform.premkumar-2ba.workers.dev' }}
      - name: Upload transcripts
        if: always() && steps.cfg.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: svt-results
          path: worker/svt/results/
