name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Production dependency audit (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        application:
          - worker
          - web
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  sbom:
    name: Production SBOM (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        application:
          - worker
          - web
    defaults:
      run:
        working-directory: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.application }}/package-lock.json
      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > ${{ matrix.application }}-sbom.cdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.application }}-production-sbom
          path: ${{ matrix.application }}/${{ matrix.application }}-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history and contents
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
