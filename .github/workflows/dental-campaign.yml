name: Prepare dental organization campaign assets

on:
  workflow_dispatch:
    inputs:
      city:
        description: Organization city
        required: true
        default: bengaluru
        type: choice
        options:
          - bengaluru
          - chennai
          - hyderabad
      target:
        description: Organization slug from organization-targets.json
        required: true
        type: string
      include_audio:
        description: Generate Sarvam MP3 audio
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: dental-organization-campaign-${{ inputs.city }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare organization campaign asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      TARGET_SLUG: ${{ inputs.target }}
      TARGET_CITY: ${{ inputs.city }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate organization campaign files
        run: |
          case "$TARGET_SLUG" in
            (*[!a-z0-9-]*) echo "::error::Target must be a lowercase slug"; exit 1 ;;
          esac
          node --check campaigns/india-dental-leads/scripts/build-organization-targets.mjs
          node --check campaigns/india-dental-leads/scripts/generate-organization-demo.mjs
          node --test campaigns/india-dental-leads/scripts/build-organization-targets.test.mjs
          node -e "const p=require('./campaigns/india-dental-leads/data/cities/${TARGET_CITY}/organization-targets.json'); if (!p.organizations.some(x => x.slug === process.env.TARGET_SLUG)) process.exit(1)"

      - name: Generate text asset
        if: ${{ !inputs.include_audio }}
        run: node campaigns/india-dental-leads/scripts/generate-organization-demo.mjs --city "$TARGET_CITY" --target "$TARGET_SLUG"

      - name: Generate text and audio assets
        if: ${{ inputs.include_audio }}
        run: |
          if [ -z "$SARVAM_API_KEY" ]; then
            echo "::error::SARVAM_API_KEY is required when Include audio is enabled"
            exit 1
          fi
          node campaigns/india-dental-leads/scripts/generate-organization-demo.mjs \
            --city "$TARGET_CITY" \
            --target "$TARGET_SLUG" \
            --audio \
            --engine sarvam

      - name: Upload campaign asset
        uses: actions/upload-artifact@v6
        with:
          name: dental-organization-campaign-asset
          path: campaigns/india-dental-leads/assets/demos/${{ inputs.city }}/
          if-no-files-found: error
          retention-days: 7
