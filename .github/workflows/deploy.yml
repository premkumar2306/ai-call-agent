name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  WORKER_NAME: mogi-platform
  # Must match `database_name` in worker/wrangler.toml — `wrangler d1
  # migrations apply` resolves this against that file, not against Cloudflare.
  D1_DATABASE_NAME: mogi-platform
  WEB_PROJECT_NAME: mogi-admin
  WORKER_API_URL: https://mogi-platform.premkumar-2ba.workers.dev

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      # Guards the rename trap that silently stopped this workflow deploying:
      # a name CI passes to wrangler that no longer exists in wrangler.toml
      # fails the migration step, which skips the deploy step.
      - name: Validate wrangler config
        run: |
          node scripts/validate-config.mjs \
            --worker-name "${{ env.WORKER_NAME }}" \
            --d1-name "${{ env.D1_DATABASE_NAME }}"

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      # Prove the bundle builds before the migration step mutates the
      # production schema — otherwise a broken build leaves the DB migrated
      # ahead of the deployed code.
      - name: Build check
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dryrun

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply ${{ env.D1_DATABASE_NAME }} --remote

      - name: Deploy Worker
        run: npx wrangler deploy

  deploy-web:
    name: Deploy Web (Pages)
    needs: deploy-worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ env.WORKER_API_URL }}

      - name: Deploy to Pages
        run: npx wrangler pages deploy dist --project-name ${{ env.WEB_PROJECT_NAME }}
