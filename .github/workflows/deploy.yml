name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight deploy: interrupting it between the D1 migration
# and the Worker upload can leave the schema and code out of step.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  # Override with repository variables (Settings → Secrets and variables →
  # Actions → Variables) if the Worker or Pages project lives elsewhere. The
  # Worker name itself always comes from worker/wrangler.toml.
  WORKER_URL: ${{ vars.WORKER_URL || 'https://mogi-platform.premkumar-2ba.workers.dev' }}
  PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'mogi-admin' }}
  WRANGLER_SEND_METRICS: "false"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-worker:
    name: Deploy Worker
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.WORKER_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      # Addressed by binding, not database name, so a rename in wrangler.toml
      # can't silently break this step again.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        run: npx wrangler deploy --message "${{ github.sha }}"

      # `curl -f` prints nothing on a non-2xx, so a 503 naming the missing
      # config looked identical to the Worker being unreachable. Capture the
      # body and surface it — that payload is the whole point of the check.
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -sS --max-time 10 -w '\n%{http_code}' "$WORKER_URL/health?deep=1" || true)
            code=$(printf '%s' "$body" | tail -n1)
            payload=$(printf '%s' "$body" | sed '$d')
            if [ "$code" = "200" ]; then echo "$payload"; exit 0; fi
            echo "health check attempt $i: HTTP ${code:-no response} ${payload}"
            sleep 6
          done
          echo "::error::$WORKER_URL/health?deep=1 did not return 200 after deploy. \
          A 503 with config.missing means those variables are unset — \
          set each with 'wrangler secret put <NAME>'."
          exit 1

  deploy-web:
    name: Deploy Web (Pages)
    needs: deploy-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ env.WORKER_URL }}
      - name: Deploy to Pages
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch main --commit-hash "${{ github.sha }}"
