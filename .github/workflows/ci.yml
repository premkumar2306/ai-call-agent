name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs this via deploy.yml
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker — type-check, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      # Bundles exactly what `wrangler deploy` would upload, without needing
      # Cloudflare credentials — catches config and import errors pre-merge.
      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: "false"

  web:
    name: Web — type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
