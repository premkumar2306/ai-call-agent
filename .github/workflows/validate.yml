name: Validate

# Gates changes before they reach main. Deploy only runs on push to main, so
# without this nothing checks a pull request — which is how a workflow that
# failed on every single run went unnoticed long enough to block a migration
# the booking path depends on.
#
# Deliberately requires no secrets: every step here runs offline, so this
# works on forks and can be made a required status check.

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Kept in step with deploy.yml. The validate-config step below is what
  # catches them drifting apart from wrangler.toml.
  WORKER_NAME: mogi-platform
  D1_DATABASE_NAME: mogi-platform

jobs:
  worker:
    name: Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Validate wrangler config
        run: |
          node scripts/validate-config.mjs \
            --worker-name "${{ env.WORKER_NAME }}" \
            --d1-name "${{ env.D1_DATABASE_NAME }}"

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build check
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-dryrun

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # `npm run build` is `tsc -b && vite build`, so this type-checks too.
      - name: Build
        run: npm run build
