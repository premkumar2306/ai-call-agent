name = "mogi-platform"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# No per-version public preview URLs: every version would otherwise be
# reachable (with production secrets) at its own URL.
preview_urls = false
# Ship source maps so stack traces in logs point at src/, not the bundle.
upload_source_maps = true

# Workers Logs: persisted, queryable logs in the dashboard (wrangler tail
# only shows live output). Lower head_sampling_rate if volume gets costly.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "mogi-platform"
database_id = "c821ca43-764a-48b0-b10c-55a8e9cc05f8"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "CACHE"
id = "a860c9ff800347938a7ea459b70af14d"

[[kv_namespaces]]
binding = "CART"
id = "47f0f8faec8646dd8f537e8adfc1678f"

[durable_objects]
bindings = [
  { name = "RELAY_DO", class_name = "CallRelay" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRelay"]

# Daily data-retention sweep (src/services/retention.service.ts), 21:17 UTC =
# 02:47 IST / 15:17 Chicago. Deletes nothing until a business sets a
# retention period (sectors.retention_days).
[triggers]
crons = ["17 21 * * *"]

[vars]
NODE_ENV = "production"
TOKEN_TTL_SECONDS = "900"
TWILIO_DEFAULT_BUSINESS_TYPE = "advanced_vtech"
TWILIO_DEFAULT_CUSTOMER_HASH = "demo-caller"
WA_DEFAULT_BUSINESS_TYPE = "advanced_vtech"
# WA_PHONE_NUMBER_MAP = '{"PHONE_NUMBER_ID_1":"dental","PHONE_NUMBER_ID_2":"auto_shop"}'
# Business for Exotel / Plivo numbers with no row in phone_numbers (admin Settings →
# Phone numbers). Unset = calls to unmapped numbers are refused.
# EXOTEL_DEFAULT_BUSINESS_TYPE = "kovai_wellness_clinic"
# PLIVO_DEFAULT_BUSINESS_TYPE = "kovai_wellness_clinic"

# ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"  # optional override, see src/config.ts
# ALLOWED_ORIGINS = "https://admin.example.com"  # extra CORS origins for the admin UI
# Sarvam (only used by businesses that select it; see README "Hindi and Hinglish calls"):
# SARVAM_STT_MODEL = "saaras:v3"       # or saaras:v4
# SARVAM_TTS_MODEL = "bulbul:v3"
# SARVAM_TTS_SPEAKER = "priya"         # default Bulbul speaker when a business sets no voice_id
# SARVAM_TTS_CODEC = "linear16"        # if the mulaw stream turns out unusable; default mulaw
# SARVAM_HIGH_VAD_SENSITIVITY = "1"

# Secrets — run: wrangler secret put <NAME>
# Required in production (the Worker fails closed without them):
# TOKEN_SECRET          (>= 32 random chars; signs session + media-stream tokens)
# CUSTOMER_HASH_SALT    (HMAC salt for customer/phone identifiers — never rotate casually)
# ANTHROPIC_API_KEY
# ADMIN_SECRET          (X-Admin-Key for /admin/*)
# TWILIO_AUTH_TOKEN     (webhook signature verification)
# TWILIO_WEBHOOK_URL    (public base URL Twilio calls, e.g. https://mogi-platform.<acct>.workers.dev)
# DEEPGRAM_API_KEY, CARTESIA_API_KEY   (voice)
# SARVAM_API_KEY        (Hindi / Hinglish voice via Sarvam AI — needed only by businesses whose
#                        voice settings pick Sarvam STT or TTS; their calls fail closed without it)
# RESEND_API_KEY        (business-owner sign-in codes; without it /account/login/start returns 503 in production)
# EMAIL_FROM            (sender on a Resend-verified domain, e.g. "Avery <hello@yourdomain.com>")
# Optional: MOGI_SECRET, CARTESIA_VOICE_ID, CARTESIA_MODEL_ID
#
# WhatsApp (required if the /whatsapp webhook is in use):
# WA_APP_SECRET         (Meta app secret → X-Hub-Signature-256)
# WA_VERIFY_TOKEN       (arbitrary string you pick, enter in Meta webhook config)
# WA_PHONE_NUMBER_ID    (found in Meta for Developers → WhatsApp → Phone Numbers)
# WA_ACCESS_TOKEN       (permanent system user token with whatsapp_business_messaging scope)
#
# Indian numbers via Exotel (optional — see README "Indian phone numbers"):
# EXOTEL_WEBHOOK_SECRET (random; Exotel doesn't sign webhooks, so every /exotel/* URL
#                        in the call flow carries it as Basic auth or ?key=. Without it
#                        production rejects all /exotel/* requests.)
# Plivo (optional, alternative to Exotel):
# PLIVO_AUTH_TOKEN      (verifies X-Plivo-Signature-V3)
# PLIVO_WEBHOOK_URL     (public base URL Plivo calls)
#
# Calendar integration (optional — see README "Calendar integration"):
# CALENDAR_TOKEN_KEY    (random; encrypts stored calendar refresh tokens)
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   (OAuth client, redirect URI <worker>/oauth/google/callback)
