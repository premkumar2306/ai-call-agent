<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avery</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (no flash). See src/theme.ts.
      try { var t = localStorage.getItem('avery.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
